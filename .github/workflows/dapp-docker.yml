name: Build and push dapp Docker image

on:
  # Devnet continuously tracks main: every push to main builds a main-<sha>
  # image and opens the auto-merge devnet deploy PR (same model as
  # canton-middleware's docker-build-release.yml).
  push:
    branches:
      - main
    tags:
      - 'dapp-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. dapp-v1.1.0)'
        required: true
  # release-please calls this directly with the fresh dapp-v* tag: tags created
  # with the workflow's own GITHUB_TOKEN never fire the push trigger above
  # (GitHub suppresses workflow runs for GITHUB_TOKEN-created events), so the
  # release run must invoke the versioned build itself. Release builds are for
  # manual prod promotion only — devnet is NOT deployed from them.
  workflow_call:
    inputs:
      tag:
        description: 'Tag to build (e.g. dapp-v1.1.0)'
        required: true
        type: string
    secrets:
      INFRA_GH_TOKEN:
        required: true

# inputs.tag keeps release builds (workflow_call evaluates github.ref in the
# caller's context = refs/heads/main) out of the main-push group: GitHub holds
# only ONE pending run per group, so a queued release build sharing the main
# group would be silently displaced — and cancelled — by the next main push.
concurrency:
  group: dapp-docker-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      deploy_devnet: ${{ steps.version.outputs.deploy_devnet }}
    steps:
      - uses: actions/checkout@v4
        with:
          # `inputs` covers both workflow_dispatch and workflow_call; on push
          # events it is empty and github.sha pins the pushed commit — the ref
          # name would resolve to the branch TIP at checkout time, letting a
          # build tagged main-<shaA> silently contain a later push's tree.
          ref: ${{ inputs.tag || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image version
        id: version
        env:
          INPUT: ${{ inputs.tag }}
          REF: ${{ github.ref_name }}
        run: |
          # deploy_devnet is the single source of truth for "main-tracking
          # build": it drives the `latest` tag and the open-devnet-pr job, so
          # the three can't drift apart. True only for pushes to main —
          # dispatch and workflow_call always set INPUT, tag pushes hit the
          # dapp-v* branch.
          if [ -n "$INPUT" ]; then
            VERSION="${INPUT#dapp-v}"
            DEPLOY_DEVNET=false
          elif [[ "$REF" == dapp-v* ]]; then
            VERSION="${REF#dapp-v}"
            DEPLOY_DEVNET=false
          elif [ "$REF" = "main" ]; then
            VERSION="main-${GITHUB_SHA::7}"
            DEPLOY_DEVNET=true
          else
            echo "::error::cannot derive an image version from ref '$REF' (expected main, a dapp-v* tag, or a tag input)"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "deploy_devnet=$DEPLOY_DEVNET" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/chainsafe/canton-dapp
          # `latest` tracks main (what devnet runs); versioned release images
          # keep their X.Y.Z tag only, for manual prod promotion.
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ steps.version.outputs.deploy_devnet == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/dapp/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  open-devnet-pr:
    name: Open devnet deploy PR
    needs: build-push
    runs-on: ubuntu-latest
    # Devnet continuously tracks main: deploy the main-<sha> image on every
    # push to main. Versioned release builds (workflow_call) and manual
    # dispatches build images only; prod (validator-prod1/prod2) promotion
    # stays manual. See ChainSafe/infrastructure-general#1353.
    if: needs.build-push.outputs.deploy_devnet == 'true'
    env:
      DIR: definitions/canton/validator-dev1
      FILE: canton-dapp-ui-values.yml
    steps:
      - name: Checkout infra-kubernetes
        uses: actions/checkout@v4
        with:
          repository: ChainSafe/infra-kubernetes
          token: ${{ secrets.INFRA_GH_TOKEN }}
          ref: main

      - name: Update image tag
        env:
          VERSION: ${{ needs.build-push.outputs.version }}
        run: |
          yq e '.["canton-dapp-ui"].image.tag = strenv(VERSION)' -i "${DIR}/${FILE}"

      - name: Create signed commit and open PR
        env:
          VERSION: ${{ needs.build-push.outputs.version }}
          GH_TOKEN: ${{ secrets.INFRA_GH_TOKEN }}
          REPO: ChainSafe/infra-kubernetes
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          BRANCH="cd/devnet-canton-dapp-${VERSION}"
          COMMIT_MSG="chore(devnet): deploy canton-dapp ${VERSION}"

          # Supersede older devnet deploy PRs first: at per-push cadence,
          # overlapping PRs edit the same image.tag line, so the loser would
          # sit conflicted forever with auto-merge still armed — a later
          # "resolve conflicts" on it would roll devnet BACK. Latest push
          # wins; deleting the branch disarms the stale auto-merge.
          gh pr list --repo "${REPO}" --state open --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"cd/devnet-canton-dapp-\")) | select(.headRefName != \"${BRANCH}\") | .number" \
          | while read -r OLD; do
              gh pr close "$OLD" --repo "${REPO}" \
                --comment "Superseded by ${BRANCH}." --delete-branch \
                || echo "::warning::failed to close superseded deploy PR #${OLD}"
            done

          # Get current HEAD SHA of main
          HEAD_SHA=$(gh api repos/${REPO}/git/ref/heads/main --jq '.object.sha')

          # Create branch pointing at main HEAD. Tolerate ONLY "already
          # exists" (idempotent re-run); any other failure — e.g. an
          # INFRA_GH_TOKEN without contents:write — must surface with the
          # API's actual error here, not as a bare 404 from the ref lookup
          # two commands later.
          if ! CREATE_OUT=$(gh api repos/${REPO}/git/refs \
              --method POST \
              --field ref="refs/heads/${BRANCH}" \
              --field sha="${HEAD_SHA}" 2>&1); then
            if ! grep -q "Reference already exists" <<<"${CREATE_OUT}"; then
              echo "::error::failed to create ${BRANCH} on ${REPO}: ${CREATE_OUT}"
              exit 1
            fi
          fi

          # Get current branch HEAD SHA
          BRANCH_SHA=$(gh api repos/${REPO}/git/ref/heads/${BRANCH} --jq '.object.sha')

          # Commit the bump unless the branch already has it (idempotent
          # re-run). Everything after this block always runs, so a re-run
          # repairs a missing PR instead of exiting early.
          BRANCH_TAG=$(gh api "repos/${REPO}/contents/${DIR}/${FILE}?ref=${BRANCH}" \
            -H "Accept: application/vnd.github.raw" 2>/dev/null \
            | yq e '.["canton-dapp-ui"].image.tag' - 2>/dev/null || echo "")
          if [ "$BRANCH_TAG" = "$VERSION" ]; then
            echo "Branch already at tag ${VERSION}, skipping commit"
          else
            # Commits via createCommitOnBranch are automatically signed by
            # GitHub (Verified).
            ADDITIONS=$(jq -nc \
              --arg path "${DIR}/${FILE}" \
              --arg contents "$(base64 -w0 ${DIR}/${FILE})" \
              '[{path: $path, contents: $contents}]')

            jq -nc \
              --arg repo "$REPO" --arg branch "$BRANCH" --arg oid "$BRANCH_SHA" \
              --arg msg "$COMMIT_MSG" --argjson additions "$ADDITIONS" \
              '{
                query: "mutation($repo: String!, $branch: String!, $oid: GitObjectID!, $msg: String!, $additions: [FileAddition!]!) { createCommitOnBranch(input: { branch: { repositoryNameWithOwner: $repo, branchName: $branch }, message: { headline: $msg }, fileChanges: { additions: $additions }, expectedHeadOid: $oid }) { commit { url } } }",
                variables: { repo: $repo, branch: $branch, oid: $oid, msg: $msg, additions: $additions }
              }' | gh api graphql --input -
          fi

          # Ensure the deploy PR exists. Create failures are fatal: a missing
          # PR must surface as a red job, not a silently skipped deploy.
          PR_NUM=$(gh pr list --repo "${REPO}" --head "${BRANCH}" --state open \
            --json number --jq '.[0].number // empty')
          if [ -z "${PR_NUM}" ]; then
            gh pr create \
              --repo "${REPO}" \
              --title "${COMMIT_MSG}" \
              --body "Automated devnet deploy to \`validator-dev1\`. Source: [${SOURCE_REPO}@${SOURCE_SHA:0:7}](https://github.com/${SOURCE_REPO}/commit/${SOURCE_SHA})" \
              --base main \
              --head "${BRANCH}"
          else
            echo "PR #${PR_NUM} already open for ${BRANCH}"
          fi
          gh pr merge --auto --squash --repo "${REPO}" "${BRANCH}"
