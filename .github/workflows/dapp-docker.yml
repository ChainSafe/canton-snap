name: Build and push dapp Docker image

on:
  push:
    tags:
      - 'dapp-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. dapp-v1.1.0)'
        required: true

concurrency:
  group: dapp-docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/chainsafe/canton-dapp
          tags: |
            type=match,pattern=dapp-v(.*),group=1
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/dapp/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
