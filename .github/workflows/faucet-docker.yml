name: Build and push faucet Docker image

on:
  push:
    tags:
      - 'faucet-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. faucet-v0.1.0)'
        required: true

concurrency:
  group: faucet-docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image version
        id: version
        env:
          INPUT: ${{ github.event.inputs.tag }}
          REF: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT" ]; then
            VERSION="${INPUT#faucet-v}"
          elif [[ "$REF" == faucet-v* ]]; then
            VERSION="${REF#faucet-v}"
          else
            VERSION=""
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if [[ "$VERSION" != *-* ]]; then
            echo "is_latest=true" >> $GITHUB_OUTPUT
          else
            echo "is_latest=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/chainsafe/canton-faucet
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' }}
            type=raw,value=latest,enable=${{ steps.version.outputs.is_latest == 'true' && steps.version.outputs.version != '' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/faucet/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
