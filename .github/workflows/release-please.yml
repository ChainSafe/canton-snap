name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    name: Open / update release PR
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs['packages/snap--release_created'] }}
      tag_name: ${{ steps.release.outputs['packages/snap--tag_name'] }}
      version: ${{ steps.release.outputs['packages/snap--version'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to npm
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm to a version that supports Trusted Publishing
        # npm OIDC (Trusted Publishing) requires CLI >= 11.5.1. Node 20 ships
        # npm 10.x, so we pin a known-good 11.x release explicitly.
        run: npm install --global npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Verify versions are in sync with the release tag
        run: |
          TAG="${{ needs.release-please.outputs.version }}"
          PKG=$(node -p "require('./packages/snap/package.json').version")
          MAN=$(node -p "require('./packages/snap/snap.manifest.json').version")
          echo "release=$TAG pkg=$PKG manifest=$MAN"
          if [ "$TAG" != "$PKG" ] || [ "$PKG" != "$MAN" ]; then
            echo "::error::Version mismatch between release, package.json, and snap.manifest.json"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Build snap and fail on production-support warnings
        # mm-snap build auto-syncs snap.manifest.json's shasum + platformVersion
        # to match the freshly built bundle, then emits warnings (exit code 0)
        # if anything in the manifest is unsafe to ship. The most important one
        # is the prod-platformVersion warning — if @metamask/snaps-sdk gets
        # bumped past what production MetaMask supports, the snap won't install
        # for end users. Promote that warning to a hard failure here.
        run: |
          set -o pipefail
          npm -w packages/snap run build:clean 2>&1 | tee build.log
          if grep -q "is not supported in the production version of MetaMask" build.log; then
            echo "::error::mm-snap reported the snap's platformVersion exceeds production MetaMask. Pin @metamask/snaps-sdk to a supported version."
            exit 1
          fi

      - name: Test snap (jest integration)
        run: npm -w packages/snap test

      - name: Test snap (vitest crypto cross-validation)
        run: npm -w packages/snap run test:crypto

      - name: Publish to npm via Trusted Publishing
        # Trusted Publishing: npm CLI exchanges the GitHub OIDC token (granted
        # by id-token: write at the workflow level) for a short-lived npm
        # publish token at the registry. No NPM_TOKEN secret needed. Provenance
        # is generated automatically from the same OIDC token.
        run: npm publish --workspace packages/snap --access public

      - name: Attach install instructions to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          {
            echo
            echo "---"
            echo
            echo "### Install in a dApp"
            echo
            echo '```ts'
            echo 'await window.ethereum.request({'
            echo '  method: "wallet_requestSnaps",'
            echo "  params: { \"npm:@chainsafe/canton-snap\": { version: \"^${VERSION}\" } },"
            echo '});'
            echo '```'
            echo
            echo "Published to npm: https://www.npmjs.com/package/@chainsafe/canton-snap/v/${VERSION}"
          } > install-notes.md
          gh release view "$TAG" --json body --jq .body > existing-notes.md || true
          cat existing-notes.md install-notes.md > combined-notes.md
          gh release edit "$TAG" --notes-file combined-notes.md
