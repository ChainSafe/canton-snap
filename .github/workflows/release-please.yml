name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

# packages: write is not used here directly — it caps what the called
# dapp-docker.yml workflow may hold, and its build job pushes to ghcr.
permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  release-please:
    name: Open / update release PR
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs['packages/snap--release_created'] }}
      tag_name: ${{ steps.release.outputs['packages/snap--tag_name'] }}
      version: ${{ steps.release.outputs['packages/snap--version'] }}
      dapp_release_created: ${{ steps.release.outputs['packages/dapp--release_created'] }}
      dapp_tag_name: ${{ steps.release.outputs['packages/dapp--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The dapp-v* tag created above comes from the workflow's GITHUB_TOKEN, and
  # GitHub never runs workflows for GITHUB_TOKEN-created events — so
  # dapp-docker.yml's `on: push: tags:` trigger cannot fire for releases. Call
  # it directly instead (same pattern as canton-middleware's release flow).
  build-dapp-image:
    name: Build dapp image + devnet deploy PR
    needs: release-please
    if: needs.release-please.outputs.dapp_release_created == 'true'
    uses: ./.github/workflows/dapp-docker.yml
    with:
      tag: ${{ needs.release-please.outputs.dapp_tag_name }}
      deploy_devnet: true
    secrets:
      INFRA_GH_TOKEN: ${{ secrets.INFRA_GH_TOKEN }}

  publish:
    name: Publish to npm
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm
        # Trusted Publishing requires npm >= 11.5.1; Node 20 ships 10.x.
        run: npm install --global npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Verify versions match release tag
        run: |
          TAG="${{ needs.release-please.outputs.version }}"
          PKG=$(node -p "require('./packages/snap/package.json').version")
          MAN=$(node -p "require('./packages/snap/snap.manifest.json').version")
          if [ "$TAG" != "$PKG" ] || [ "$PKG" != "$MAN" ]; then
            echo "::error::version mismatch: release=$TAG pkg=$PKG manifest=$MAN"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Build snap
        # mm-snap warns (exit 0) if platformVersion exceeds prod MetaMask; fail on it.
        run: |
          set -o pipefail
          npm -w packages/snap run build:clean 2>&1 | tee build.log
          if grep -q "is not supported in the production version of MetaMask" build.log; then
            echo "::error::platformVersion exceeds production MetaMask. Pin @metamask/snaps-sdk to a supported version."
            exit 1
          fi

      - name: Test (jest)
        run: npm -w packages/snap test

      - name: Test (vitest crypto)
        run: npm -w packages/snap run test:crypto

      - name: Publish to npm
        # OIDC via id-token:write; no NPM_TOKEN. Provenance is automatic.
        run: npm publish --workspace packages/snap --access public

      - name: Attach install instructions to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          {
            echo
            echo "---"
            echo
            echo "### Install in a dApp"
            echo
            echo '```ts'
            echo 'await window.ethereum.request({'
            echo '  method: "wallet_requestSnaps",'
            echo "  params: { \"npm:@chainsafe/canton-snap\": { version: \"^${VERSION}\" } },"
            echo '});'
            echo '```'
            echo
            echo "Published to npm: https://www.npmjs.com/package/@chainsafe/canton-snap/v/${VERSION}"
          } > install-notes.md
          gh release view "$TAG" --json body --jq .body > existing-notes.md || true
          cat existing-notes.md install-notes.md > combined-notes.md
          gh release edit "$TAG" --notes-file combined-notes.md
